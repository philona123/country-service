[project]
name = "country-service"
version = "1.0.0"
description = "GraphQL country information API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "APScheduler==3.11.3",
    "fastapi[standard]==0.162.0",
    "httpx==0.28.1",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "pymongo==4.19.0",
    "python-dotenv==1.2.4",
    "redis==5.2.1",
    "strawberry-graphql==0.339.0",
]

[project.scripts]
dev = "app.cli:dev"
test = "app.cli:test"
test-integration = "app.cli:test_integration"
test-all = "app.cli:test_all"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "mongomock==4.3.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["*.py"]
python_functions = ["test_*"]
